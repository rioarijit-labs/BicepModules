name: Validate

on:
  pull_request:
    branches: [main]
    paths:
      - 'modules/**'

permissions:
  contents: read
  id-token: write

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.changes.outputs.modules }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed modules
        id: changes
        run: |
          CHANGED=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" -- modules | awk -F/ '{print $2}' | sort -u)
          MODULES=$(printf '%s\n' "$CHANGED" | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "modules=$MODULES" >> "$GITHUB_OUTPUT"
          echo "Changed modules: $MODULES"

  lint-and-build:
    needs: detect-changes
    if: needs.detect-changes.outputs.modules != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.detect-changes.outputs.modules) }}
    steps:
      - uses: actions/checkout@v4

      - name: Install/upgrade Bicep CLI
        run: |
          az bicep install
          az bicep upgrade

      - name: Lint module
        run: az bicep lint --file "modules/${{ matrix.module }}/main.bicep"

      - name: Build module
        run: az bicep build --file "modules/${{ matrix.module }}/main.bicep" --stdout > /dev/null

      - name: Build example
        run: az bicep build --file "modules/${{ matrix.module }}/examples/main.bicep" --stdout > /dev/null

  what-if:
    needs: [detect-changes, lint-and-build]
    if: needs.detect-changes.outputs.modules != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.detect-changes.outputs.modules) }}
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: What-if deployment
        run: |
          az deployment group what-if \
            --resource-group "${{ vars.SANDBOX_RESOURCE_GROUP }}" \
            --template-file "modules/${{ matrix.module }}/examples/main.bicep"
